name: ci

on:
  push:
    branches: [main]
    paths: &paths
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - .golangci.yml
      - docs/protocol/**
      - .github/workflows/ci.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build
