name: ci

# The server part, built and tested without Node. Changes to the protocol
# contract in docs/protocol/ trigger every workflow.
on:
  push:
    branches: [main]
    paths: &paths
      - "**.go"
      - go.mod
      - go.sum
      - Makefile
      - .golangci.yml
      - web/headless/**
      - docs/protocol/**
      - .github/workflows/ci.yml
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make go-lint
      - run: make go-test
      - run: make go-build
      - name: Check that GET / serves the placeholder
        run: |
          bin/amber serve --http=127.0.0.1:8090 --dir="$RUNNER_TEMP/data" &
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/api/health
          curl -fsS http://127.0.0.1:8090/ | grep -F "The web UI is not included in this build"
          bin/amber --version | grep -F "without the web UI"
