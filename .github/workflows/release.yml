name: release

# A tag vX.Y.Z on main publishes the binaries, checksums.txt, the changelog
# and the image ghcr.io/joansebgarcia/trace (see .goreleaser.yaml).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog needs the history since the previous tag.
          fetch-depth: 0
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: Check that GET / serves the embedded UI
        run: |
          bin/trace serve --http=127.0.0.1:8090 --dir="$RUNNER_TEMP/data" &
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/api/health
          curl -fsS http://127.0.0.1:8090/ | grep -F '<div id="app">'
          bin/trace --version | grep -F "with the web UI embedded"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
